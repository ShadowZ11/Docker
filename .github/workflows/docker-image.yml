name: Publish Docker images to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "docker-dind/**"
      - "docker-java/**"
      - "docker-maven/**"
      - "docker-nodeJS/**"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docker-dind/**"
      - "docker-java/**"
      - "docker-maven/**"
      - "docker-nodeJS/**"
      - ".github/workflows/docker-image.yml"
  # Rebuild everything cache-less every week: kubectl/Helm/Terraform versions are
  # resolved at build time, so without this the GHA layer cache would pin them to
  # whatever was current the day the layer was first created.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Ignore the build cache (forces tool versions to be re-resolved)"
        type: boolean
        default: false

env:
  DOCKERHUB_NAMESPACE: shad0wz7
  SINGLEARCH_PLATFORM: linux/amd64
  MULTIARCH_PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: docker-images-${{ github.ref }}
  # Only collapse redundant PR runs; cancelling a run on main could drop a publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed image folders
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ci:
              - '.github/workflows/docker-image.yml'
            dind:
              - 'docker-dind/**'
            java:
              - 'docker-java/**'
            maven:
              - 'docker-maven/Dockerfile'
            maven_aws:
              - 'docker-maven/aws-cli/**'
            maven_azure:
              - 'docker-maven/azure-cli/**'
            maven_gcloud:
              - 'docker-maven/gcloud-cli/**'
            node:
              - 'docker-nodeJS/Dockerfile'
            node_aws:
              - 'docker-nodeJS/aws-cli/**'
            node_azure:
              - 'docker-nodeJS/azure-cli/**'
            node_gcloud:
              - 'docker-nodeJS/gcloud-cli/**'

      # Single source of truth for the image catalogue. To add a variant, add an
      # entry here plus a matching paths-filter above. `"disabled": true` keeps a
      # variant documented but out of every build.
      - name: Build job matrix
        id: matrix
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          # Pushed commits on main (the merge/squash commit carries the PR title),
          # PR title on pull_request so the PR validates what main will publish.
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, '\n') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          cat > /tmp/images.json <<'JSON'
          [
            {
              "key": "dind",
              "context": "docker-dind",
              "image": "docker-dind",
              "description": "Docker-in-Docker image with Azure CLI, AWS CLI and Terraform",
              "smoke": "docker --version && az version && aws --version && eb --version && node --version && terraform -version"
            },
            {
              "key": "java",
              "context": "docker-java",
              "image": "java-aws-terraform",
              "description": "DEPRECATED - Java tool image with Maven, AWS CLI, Azure CLI, kubectl, Helm and Terraform",
              "smoke": "mvn -v && aws --version && eb --version && az version && kubectl version --client && helm version && terraform -version"
            },
            {
              "key": "maven",
              "disabled": true,
              "context": "docker-maven",
              "image": "maven-terraform",
              "description": "Maven tool image with AWS CLI, Azure CLI, Google Cloud CLI, kubectl, Helm and Terraform",
              "smoke": "mvn -v && aws --version && eb --version && az version && gcloud --version && kubectl version --client && helm version && terraform -version"
            },
            {
              "key": "maven_aws",
              "context": "docker-maven/aws-cli",
              "image": "maven-aws-cli",
              "description": "Maven image with AWS CLI, kubectl, Helm and Terraform",
              "smoke": "mvn -v && aws --version && eb --version && kubectl version --client && helm version && terraform -version"
            },
            {
              "key": "maven_azure",
              "context": "docker-maven/azure-cli",
              "image": "maven-azure-cli",
              "description": "Maven image with Azure CLI, kubectl, Helm and Terraform",
              "smoke": "mvn -v && az version && kubectl version --client && helm version && terraform -version"
            },
            {
              "key": "maven_gcloud",
              "context": "docker-maven/gcloud-cli",
              "image": "maven-gcloud-cli",
              "description": "Maven image with Google Cloud CLI, kubectl, Helm and Terraform",
              "smoke": "mvn -v && gcloud --version && kubectl version --client && helm version && terraform -version"
            },
            {
              "key": "node",
              "disabled": true,
              "context": "docker-nodeJS",
              "image": "node-aws-terraform",
              "description": "Node.js tool image with AWS CLI, Azure CLI, Google Cloud CLI, kubectl, Helm and Terraform",
              "smoke": "node -v && aws --version && eb --version && az version && gcloud --version && kubectl version --client && helm version && terraform -version"
            },
            {
              "key": "node_aws",
              "context": "docker-nodeJS/aws-cli",
              "image": "node-aws-cli",
              "description": "Node.js image with AWS CLI, kubectl and Terraform",
              "smoke": "node -v && aws --version && eb --version && kubectl version --client && terraform -version"
            },
            {
              "key": "node_azure",
              "context": "docker-nodeJS/azure-cli",
              "image": "node-azure-cli",
              "description": "Node.js image with Azure CLI, kubectl and Terraform",
              "smoke": "node -v && az version && kubectl version --client && terraform -version"
            },
            {
              "key": "node_gcloud",
              "context": "docker-nodeJS/gcloud-cli",
              "image": "node-gcloud-cli",
              "description": "Node.js image with Google Cloud CLI, kubectl, Helm and Terraform",
              "smoke": "node -v && gcloud --version && kubectl version --client && helm version && terraform -version"
            }
          ]
          JSON

          # workflow_dispatch and schedule rebuild everything. A change to this
          # workflow itself (the "ci" filter) revalidates every image on a PR, but
          # on main it only republishes the images whose folder changed, unless a
          # pushed commit carries [rebuild-all] (e.g. in the PR title).
          markers="$COMMIT_MESSAGES"$'\n'"$PR_TITLE"
          ci_changed=false
          if jq -e 'index("ci")' >/dev/null <<<"$CHANGES"; then ci_changed=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ github.event_name }}" = "schedule" ] \
             || grep -qF '[rebuild-all]' <<<"$markers" \
             || { [ "$ci_changed" = true ] && [ "$PUBLISH" != true ]; }; then
            sel='["__all__"]'
          else
            sel="${CHANGES:-[]}"
          fi

          # [rebuild: dind, node_aws] adds those images on top of the selection
          # above (never removes any). Names are a catalogue key (node_aws or
          # node-aws), an image name (node-aws-cli) or a family (maven = every
          # enabled maven_* variant); an unknown name fails the run rather than
          # silently skipping a critical rebuild.
          requested=$({ grep -oE '\[rebuild:[^]]*\]' <<<"$markers" || true; } \
            | sed -E 's/^\[rebuild:|\]$//g' | tr -d '[:blank:]' | tr ',' '\n' \
            | tr '[:upper:]' '[:lower:]' | sed '/^$/d' | jq -R . | jq -sc 'unique')
          if [ "$requested" != "[]" ]; then
            resolved=$(jq -c --argjson req "$requested" '
              map(select(.disabled != true)) as $enabled
              | $req | map(. as $n | {name: $n, keys: ([$enabled[]
                  | select(.key == $n or (.key | gsub("_"; "-")) == $n or .image == $n)
                  | .key] as $exact
                  | if $exact != [] then $exact
                    else [$enabled[] | select(.key | startswith($n + "_")) | .key] end)})
            ' /tmp/images.json)
            unknown=$(jq -r 'map(select(.keys == []) | .name) | join(", ")' <<<"$resolved")
            if [ -n "$unknown" ]; then
              echo "::error::Unknown image(s) in [rebuild: ...]: $unknown. Valid names: maven, node, $(jq -r 'map(select(.disabled != true) | .key) | join(", ")' /tmp/images.json)"
              exit 1
            fi
            add=$(jq -c 'map(.keys[]) | unique' <<<"$resolved")
            sel=$(jq -c --argjson add "$add" '. + $add | unique' <<<"$sel")
            echo "Requested via [rebuild: ...]: $(jq -r 'join(", ")' <<<"$add")"
          fi

          matrix=$(jq -c --argjson sel "$sel" '
            map(select(.disabled != true))
            | map(select(.key as $k | ($sel | index("__all__")) != null or ($sel | index($k)) != null))
            | {include: .}
          ' /tmp/images.json)

          count=$(jq -r '.include | length' <<<"$matrix")
          {
            echo "matrix=$matrix"
            echo "any=$([ "$count" -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          echo "Building $count image(s):"
          jq -r '.include[].image' <<<"$matrix"

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      PUBLISH: ${{ needs.detect-changes.outputs.publish }}
      # On a publish run the image is pushed (multi-arch, cannot be loaded), so the
      # smoke test and Trivy pull it back by digest tag; otherwise it is loaded locally.
      IMAGE_REF: ${{ needs.detect-changes.outputs.publish == 'true' && format('shad0wz7/{0}:{1}', matrix.image, github.sha) || format('shad0wz7/{0}:ci', matrix.image) }}
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v7

      # QEMU is only needed for the arm64 leg, which only runs when publishing.
      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate on PRs too, otherwise base-image pulls hit the anonymous rate limit.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=${{ github.sha }},enable=${{ env.PUBLISH == 'true' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=ci,enable=${{ env.PUBLISH != 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.url=https://hub.docker.com/r/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          platforms: ${{ env.PUBLISH == 'true' && env.MULTIARCH_PLATFORMS || env.SINGLEARCH_PLATFORM }}
          load: ${{ env.PUBLISH != 'true' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.key }}
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

      # Catches a tool that installs but does not actually run - broken venv, missing
      # PATH entry, wrong architecture. A successful build proves none of that.
      - name: Smoke test ${{ matrix.image }}
        run: |
          if [ "$PUBLISH" = "true" ]; then docker pull --quiet "$IMAGE_REF"; fi
          docker run --rm --entrypoint sh "$IMAGE_REF" -c '${{ matrix.smoke }}'

      - name: Scan ${{ matrix.image }} with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-${{ matrix.key }}.sarif
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Findings land in the Security tab (and as PR annotations) instead of being
      # buried in the job log where nobody reads them.
      - name: Upload Trivy results to the Security tab
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.key }}.sarif
          category: trivy-${{ matrix.key }}
