name: Publish Docker images to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "docker-dind/**"
      - "docker-java/**"
      - "docker-maven/**"
      - "docker-nodeJS/**"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docker-dind/**"
      - "docker-java/**"
      - "docker-maven/**"
      - "docker-nodeJS/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: shad0wz7
  SINGLEARCH_PLATFORM: linux/amd64
  MULTIARCH_PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dind: ${{ steps.filter.outputs.dind }}
      java: ${{ steps.filter.outputs.java }}
      maven: ${{ steps.filter.outputs.maven }}
      maven_aws: ${{ steps.filter.outputs.maven_aws }}
      maven_azure: ${{ steps.filter.outputs.maven_azure }}
      maven_gcloud: ${{ steps.filter.outputs.maven_gcloud }}
      node: ${{ steps.filter.outputs.node }}
      node_aws: ${{ steps.filter.outputs.node_aws }}
      node_azure: ${{ steps.filter.outputs.node_azure }}
      node_gcloud: ${{ steps.filter.outputs.node_gcloud }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed image folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dind:
              - 'docker-dind/**'
            java:
              - 'docker-java/**'
            maven:
              - 'docker-maven/**'
            maven_aws:
              - 'docker-maven/aws-cli/**'
            maven_azure:
              - 'docker-maven/azure-cli/**'
            maven_gcloud:
              - 'docker-maven/gcloud-cli/**'
            node:
              - 'docker-nodeJS/**'
            node_aws:
              - 'docker-nodeJS/aws-cli/**'
            node_azure:
              - 'docker-nodeJS/azure-cli/**'
            node_gcloud:
              - 'docker-nodeJS/gcloud-cli/**'

  build-dind:
    needs: detect-changes
    if: needs.detect-changes.outputs.dind == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build DinD tool image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-dind
          file: ./docker-dind/Dockerfile
          platforms: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.MULTIARCH_PLATFORMS || env.SINGLEARCH_PLATFORM }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/docker-dind:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/docker-dind:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan DinD image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/docker-dind:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  build-java:
    needs: detect-changes
    if: needs.detect-changes.outputs.java == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Java tool image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-java
          file: ./docker-java/Dockerfile
          platforms: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.MULTIARCH_PLATFORMS || env.SINGLEARCH_PLATFORM }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/java-aws-terraform:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/java-aws-terraform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Java image with Trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/java-aws-terraform:${{ github.sha }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

